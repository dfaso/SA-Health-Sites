<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SA Health Sites Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.css">

    <style>
        /* ==================================================
           PAGE
        ================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            font-family: Arial, Helvetica, sans-serif;

            background-color: #f2f2f2;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .main-header {
            height: 70px;

            display: flex;
            align-items: center;

            box-sizing: border-box;

            padding: 0 22px;

            background-color: #005eb8;
            color: white;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);

            position: relative;
            z-index: 2000;
        }

        .main-header h1 {
            margin: 0;

            font-size: 24px;
        }

        .main-header p {
            margin: 4px 0 0;

            font-size: 13px;
        }


        /* ==================================================
           APPLICATION LAYOUT
        ================================================== */

        .app-container {
            position: relative;

            display: flex;

            min-height: calc(100vh - 70px);
        }


        /* ==================================================
           MAP AREA

           This area fills the space beside the sidebar.
        ================================================== */

        .map-area {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            box-sizing: border-box;

            padding: 25px;
        }

        /* ==================================================
            CONTENT AREA
        ================================================== */

        .content-area {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;

            box-sizing: border-box;
        }

        /* ==================================================
           MAP FRAME

           Change the width and height here during
           development.
        ================================================== */

        .map-frame {
            width: 1800px;
            height: 850px;

            max-width: 100%;

            position: relative;
            flex-shrink: 0;

            overflow: hidden;

            border: 2px solid #b5b5b5;
            border-radius: 6px;

            background-color: white;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }


        /* ==================================================
           LEAFLET MAP
        ================================================== */

        #map {
            width: 100%;
            height: 100%;

            display: block;
        }

        .leaflet-interactive:focus,
        .leaflet-interactive:focus-visible {
            outline: none !important;
        }

        /* ==================================================
        SITE TABLE
        ================================================== */

        #siteTableSection {
            box-sizing: border-box;

            margin: 0 25px 25px;
            padding: 20px;

            background-color: white;

            border: 1px solid #cccccc;
            border-radius: 6px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .site-table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            margin-bottom: 16px;
        }

        .site-table-header h2 {
            margin: 0 0 4px;

            font-size: 20px;
        }

        .site-table-header p {
            margin: 0;

            font-size: 13px;
            color: #555555;
        }

        #clearTableFilter {
            padding: 9px 14px;

            border: none;
            border-radius: 4px;

            background-color: #005eb8;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        #clearTableFilter:hover {
            background-color: #004a92;
        }

        .site-table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        #siteTable {
            width: 100%;

            border-collapse: collapse;

            font-size: 13px;
        }

        #siteTable th,
        #siteTable td {
            padding: 10px;

            border: 1px solid #dddddd;

            text-align: left;
            vertical-align: top;
        }

        #siteTable th {
            background-color: #005eb8;
            color: white;

            white-space: nowrap;
        }

        #siteTable tbody tr:nth-child(even) {
            background-color: #f6f8fa;
        }

        #siteTable tbody tr:hover {
            background-color: #eaf3fb;
        }

        .site-table-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #exportCsvButton {
            padding: 9px 14px;

            border: none;
            border-radius: 4px;

            background-color: #005eb8;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        #exportCsvButton:hover {
            background-color: #004a92;
        }

        #resetMapButton {
            padding: 9px 14px;

            border: none;
            border-radius: 4px;

            background-color: #005eb8;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        #resetMapButton:hover {
            background-color: #004a92;
        }

        /* ==================================================
           SMALL SCREENS
        ================================================== */

        @media (max-width: 700px) {

            .main-header {
                height: 60px;

                padding: 0 14px;
            }

            .main-header h1 {
                font-size: 19px;
            }

            .main-header p {
                display: none;
            }

            .app-container {
                min-height: calc(100vh - 70px);
            }

            .map-area {
                padding: 15px;
            }

            .map-frame {
                width: 100%;
                height: 600px;
            }
        }
    </style>
</head>

<body>

    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="main-header">
        <div>
            <h1>SA Health Sites Map</h1>
            <p>
                Health sites and service locations
            </p>
        </div>
    </header>


    <!-- ==================================================
         APPLICATION
    =================================================== -->

    <main class="app-container">

        <!-- Content area -->
        <section class="content-area">
            <div class="map-area">
                <div class="map-frame">
                    <div id="map"></div>
                </div>
            </div>

            <section id="siteTableSection">
                <div class="site-table-header">
                    <div>
                        <h2>Health Sites</h2>
                        <p id="siteTableSummary">
                            Loading site data...
                        </p>
                    </div>
                    <div class="site-table-actions">

                        <button id="resetMapButton" type="button">
                            Reset Map
                        </button>
                        <button id="clearTableFilter" type="button">
                            Show All Sites
                        </button>
                        <button id="exportCsvButton" type="button">
                            Export to CSV
                        </button>

                    </div>
                </div>

                <div class="site-table-wrapper">
                    <table id="siteTable">
                        <thead>
                            <tr>
                                <th>Site Name</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Service</th>
                                <th>Address</th>
                                <th>Suburb</th>
                                <th>Postcode</th>
                                <th>LHN</th>
                                <th>Status</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="siteTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </section>

    </main>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


    <script>

        // ==================================================
        // DEFAULT MAP VIEW
        // ==================================================

        const defaultMapCentre = [-30.5, 135.5];
        const defaultMapZoom = 6;

        // ==================================================
        // TABLE STATE
        // ==================================================

        let siteData = [];

        let selectedFilter = {
            type: null,
            value: null
        };

        // ==================================================
        // CREATE MAP
        //
        // No maximum bounds are applied.
        // The standard Leaflet zoom control is disabled.
        // ==================================================

        const map = L.map("map", {

            center: defaultMapCentre,

            zoom: defaultMapZoom,

            minZoom: 2,
            maxZoom: 19,

            zoomControl: false

        });


        // ==================================================
        // BASE MAPS
        // ==================================================

        const cartoLight = L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            {
                subdomains: "abcd",

                maxZoom: 20,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    "OpenStreetMap contributors</a> " +
                    '&copy; <a href="https://carto.com/attributions">' +
                    "CARTO</a>"
            }
        );


        const openStreetMap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    "OpenStreetMap contributors</a>"
            }
        );


        const esriSatellite = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/" +
            "World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,

                attribution:
                    "Tiles &copy; Esri and contributors"
            }
        );

        // ==================================================
        // ICONS
        // ==================================================

        const icons = {

            dental: L.icon({
                iconUrl: "https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/images/dental.png",
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            }),

            hospital: L.icon({
                iconUrl: "https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/images/hospital.png",
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            }),

            ambulance: L.icon({
                iconUrl: "https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/images/ambulance.png",
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            }),

        };

        // ==================================================
        // Panes
        // ==================================================

        map.createPane("shadingPane");
        map.getPane("shadingPane").style.zIndex = 350;

        map.createPane("sitePane");
        map.getPane("sitePane").style.zIndex = 500;


        // ==================================================
        // DEFAULT BASE MAP
        // ==================================================

        openStreetMap.addTo(map);

        // ==================================================
        // OVERLAY LAYERS
        // ==================================================

        const hospital = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    pane: "sitePane",
                    radius: 7,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: "#ff365e",
                    fillOpacity: 1
                });
            },
            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `<strong>${p.name}</strong><br>
                    ${p.address},<br>
                    ${p.suburb}`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    map.setView(
                        layer.getLatLng(),
                        15
                    );
                });
            }
        }).addTo(map);

        /*
        const nganampa = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    pane: "sitePane",
                    radius: 7,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: "#17b3cf",
                    fillOpacity: 1
                });
            },

            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `Name: <strong>${p.name}</strong><br>
                Community: ${p.community}<br>
                Organisation: ${p.organisation}`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    map.setView(
                        layer.getLatLng(),
                        15
                    );
                });
            }
        }).addTo(map);
        */

        const SAAS = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    pane: "sitePane",
                    radius: 7,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: "#34752e",
                    fillOpacity: 1
                });
            },

            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `<strong>SAAS - ${p.facility_name}</strong><br>
                    ${p.facility_address},<br>
                    ${p.abs_suburb}`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    map.setView(
                        layer.getLatLng(),
                        15
                    );
                });
            }
        }).addTo(map);

        const dental = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    pane: "sitePane",
                    radius: 7,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: "#014CC6",
                    fillOpacity: 1
                });
            },

            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `<strong>${p.service} - ${p.name}</strong><br>
                    ${p.address},<br>
                    ${p.suburb}`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    map.setView(
                        layer.getLatLng(),
                        15
                    );
                });
            }
        }).addTo(map);

        const lhnLayer = L.geoJSON(null, {
            pane: "shadingPane",
            style: {
                color: "#005EB8",
                weight: 1,
                fillColor: "#005EB8",
                fillOpacity: 0.10
            },
            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `<strong>${p.lhn}</strong><br>
                    ${p.lhn_code}`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    selectedFilter = {
                        type: "lhn",
                        value: p.lhn_code
                    };

                    renderTable();

                    map.fitBounds(
                        layer.getBounds(),
                        {
                            padding: [30, 30],
                            maxZoom: 10
                        }
                    );
                });
            }
        }).addTo(map);

            /*         
            const APY = L.geoJSON(null, {
            pane: "shadingPane",
            style: {
                color: "#C70046",
                weight: 1,
                fillColor: "#C70046",
                fillOpacity: 0.10
            },
            onEachFeature: function (feature, layer) {
                const p = feature.properties || {};
                layer.bindTooltip(
                    `<strong>${p.abb_name}</strong>`,
                    {
                        sticky: true
                    }
                );
                layer.on("click", function () {
                    map.fitBounds(
                        layer.getBounds(),
                        {
                            padding: [30, 30],
                            maxZoom: 10
                        }
                    );
                });
            }
        }).addTo(map); */

        //==================================================
        // LOAD GEOJSON'S FROM GITHUB
        //==================================================

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/PublicHospitals.geojson")
            .then(response => response.json())
            .then(data => {
                hospital.addData(data);
                map.fitBounds(hospital.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load Hospital layer:", error);
            });

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/SAAS.geojson")
            .then(response => response.json())
            .then(data => {
                SAAS.addData(data);
                map.fitBounds(SAAS.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load SAAS layer:", error);
            });

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/LHN.geojson")
            .then(response => response.json())
            .then(data => {
                lhnLayer.addData(data);
                map.fitBounds(lhnLayer.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load LHN layer:", error);
            });

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/APY.geojson")
            .then(response => response.json())
            .then(data => {
                APY.addData(data);
                map.fitBounds(APY.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load APY layer:", error);
            });

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/Nganampa_Health.geojson")
            .then(response => response.json())
            .then(data => {
                nganampa.addData(data);
                map.fitBounds(nganampa.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load Nganampa Health layer:", error);
            });

        fetch("https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/SADS.geojson")
            .then(response => response.json())
            .then(data => {
                dental.addData(data);
                map.fitBounds(dental.getBounds(), {
                    padding: [20, 20]
                });
            })
            .catch(error => {
                console.error("Unable to load SA Dental layer:", error);
            });

        // ==================================================
        // LOAD SITE TABLE CSV
        // ==================================================

        fetch(
            "https://raw.githubusercontent.com/dfaso/SA-Health-Sites/main/tableCSV/sites.csv"
        )
            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        `CSV request failed: ${response.status}`
                    );
                }

                return response.text();
            })
            .then(csvText => {
                siteData = parseCSV(csvText);

                console.log(
                    "Site table records loaded:",
                    siteData.length
                );

                renderTable();
            })
            .catch(error => {
                console.error(
                    "Unable to load site table CSV:",
                    error
                );

                document.getElementById(
                    "siteTableSummary"
                ).textContent =
                    "Unable to load site data.";
            });

        function parseCSV(csvText) {
            const result = Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                transformHeader: function (header) {
                    return header.trim();
                }
            });

            if (result.errors.length > 0) {
                console.warn(
                    "CSV parsing warnings:",
                    result.errors
                );
            }

            return result.data;
        }


        function renderTable() {
            const tableBody =
                document.getElementById("siteTableBody");

            const tableSummary =
                document.getElementById("siteTableSummary");

            tableBody.innerHTML = "";

            let filteredSites = siteData;

            if (
                selectedFilter.type === "lhn" &&
                selectedFilter.value
            ) {
                filteredSites = siteData.filter(site =>
                    site.lhn_code === selectedFilter.value
                );
            }

            if (
                selectedFilter.type === "site" &&
                selectedFilter.value
            ) {
                filteredSites = siteData.filter(site =>
                    site.site_name === selectedFilter.value
                );
            }

            filteredSites.forEach(site => {
                const row =
                    document.createElement("tr");

                row.innerHTML = `
            <td>${site.site_name || ""}</td>
            <td>${site.site_category || ""}</td>
            <td>${site.site_type || ""}</td>
            <td>${site.service || ""}</td>
            <td>${site.address || ""}</td>
            <td>${site.suburb || ""}</td>
            <td>${site.postcode || ""}</td>
            <td>${site.lhn_code || ""}</td>
            <td>${site.status || ""}</td>
            <td>${site.details || ""}</td>
        `;

                tableBody.appendChild(row);
            });

            if (selectedFilter.type === "lhn") {
                tableSummary.textContent =
                    `${filteredSites.length} sites displayed for ${selectedFilter.value}`;
            } else if (selectedFilter.type === "site") {
                tableSummary.textContent =
                    `${filteredSites.length} matching site displayed`;
            } else {
                tableSummary.textContent =
                    `${filteredSites.length} sites displayed`;
            }
        }


        // ==================================================
        //  BUTTONS
        // ==================================================

        document
            .getElementById("resetMapButton")
            .addEventListener("click", function () {
                resetMapView();
            });

        document
            .getElementById("clearTableFilter")
            .addEventListener("click", function () {

                selectedFilter = {
                    type: null,
                    value: null
                };

                renderTable();

            });

        document
            .getElementById("exportCsvButton")
            .addEventListener("click", function () {

                let filteredSites = siteData;

                if (
                    selectedFilter.type === "lhn" &&
                    selectedFilter.value
                ) {
                    filteredSites = siteData.filter(site =>
                        site.lhn_code === selectedFilter.value
                    );
                }

                if (
                    selectedFilter.type === "site" &&
                    selectedFilter.value
                ) {
                    filteredSites = siteData.filter(site =>
                        site.site_name === selectedFilter.value
                    );
                }

                const csvText = Papa.unparse(filteredSites);

                const blob = new Blob(
                    [csvText],
                    { type: "text/csv;charset=utf-8;" }
                );

                const link = document.createElement("a");

                link.href = URL.createObjectURL(blob);

                link.download =
                    selectedFilter.type === "lhn"
                        ? `health-sites-${selectedFilter.value}.csv`
                        : "health-sites.csv";

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);

                URL.revokeObjectURL(link.href);

            });

        // ==================================================
        // LAYER CONTROL
        // ==================================================

        const baseMaps = {
            "Light Map": cartoLight,
            "OpenStreetMap": openStreetMap,
            "Satellite": esriSatellite
        };

        const groupedOverlays = {

            "Shading": {
                "Local Health Networks": lhnLayer,
                /* "APY Lands": APY */
            },

            "Health Sites": {
                "Hospitals": hospital,
                "Ambulance Sites": SAAS,
                "SA Dental": dental,
                /* "Nganampa Health": nganampa */
            }

        };

        L.control.groupedLayers(
            baseMaps,
            groupedOverlays,
            {
                collapsed: false,
                position: "topright"
            }
        ).addTo(map);

        // ==================================================
        // SCALE
        // ==================================================

        L.control.scale({
            metric: true,
            imperial: false,
            position: "bottomleft"
        }).addTo(map);

        // ==================================================
        // RESET MAP
        // ==================================================

        function resetMapView() {
            map.setView(
                defaultMapCentre,
                defaultMapZoom
            );
        }




        // ==================================================
        // INITIAL MAP SIZE CORRECTION
        // ==================================================

        window.addEventListener("load", function () {
            setTimeout(function () {
                map.invalidateSize(true);
                resetMapView();
            }, 300);
        });


        // ==================================================
        // BROWSER WINDOW RESIZING
        // ==================================================

        window.addEventListener("resize", function () {
            map.invalidateSize(true);
        });

    </script>

</body>

</html>
